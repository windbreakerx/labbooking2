name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: labbooking2_test
          POSTGRES_USER: labbooking
          POSTGRES_PASSWORD: labbooking
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://labbooking:labbooking@localhost:5432/labbooking2_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key
      DEBUG: "false"
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Pytest
        run: pytest --ds=config.settings.test -v

      - name: Bandit
        run: bandit -c .bandit.yml -r apps config

      - name: pip-audit
        run: pip-audit
