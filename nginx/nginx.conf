events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Пробрасываем оригинальный протокол, если есть внешний терминатор TLS,
    # иначе используем $scheme внутри compose.
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        client_max_body_size 12M;

        # Security-заголовки отдаёт Django (config.middleware.SecurityMiddleware),
        # чтобы не дублировать их и не ломать CSP/STS в проде.

        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Публичного /media/ нет: методички отдаёт Django после проверки входа
        # и прав доступа, а nginx читает файл по внутреннему X-Accel-Redirect.
        location /protected-media/ {
            internal;
            alias /app/media/;
            add_header X-Content-Type-Options nosniff always;
        }

        # Админка: доступ только с офисных/VPN-адресов. Раскомментируйте блок
        # и укажите свои подсети; при доступе из интернета оставьте rate limit
        # (он уже есть на уровне Django) и включите 2FA для сисадмина.
        # location /admin/ {
        #     allow 10.0.0.0/8;
        #     allow 192.168.0.0/16;
        #     deny all;
        #     proxy_pass http://django;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        # }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
