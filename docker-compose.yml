services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Даём PostgreSQL время на корректное завершение (SIGINT + fast shutdown),
    # иначе Docker прибьёт процесс через 10 секунд.
    stop_grace_period: 1m
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labbooking2}
      POSTGRES_USER: ${POSTGRES_USER:-labbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labbooking}
    volumes:
      # Прод (Linux): POSTGRES_DATA_DIR=/srv/labbooking2/pgdata — bind mount,
      # данные видны на хосте и удобны для бэкапа.
      # Без переменной — именованный том (dev, Windows).
      - ${POSTGRES_DATA_DIR:-postgres_data}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labbooking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application -c /app/gunicorn.conf.py"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - staticfiles_data:/app/staticfiles
      # Прод: MEDIA_DATA_DIR=/srv/labbooking2/media — bind mount для бэкапа файлов.
      - ${MEDIA_DATA_DIR:-media_data}:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 45s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles_data:/app/staticfiles:ro
      - ${MEDIA_DATA_DIR:-media_data}:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    command: python manage.py qcluster
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  staticfiles_data:
  media_data:
